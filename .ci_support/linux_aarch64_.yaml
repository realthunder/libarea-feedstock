# Cross-compiled from linux-64. Nothing here is architecture-specific and
# Clipper is built in, so no emulated runtime is involved; the consumer test
# is native-only (see recipe.yaml) because it runs what it builds.
c_compiler:
- gcc
c_compiler_version:
- '14'
c_stdlib:
- sysroot
c_stdlib_version:
- '2.17'
channel_sources:
- realthunder, conda-forge
channel_targets:
- realthunder main
cxx_compiler:
- gxx
cxx_compiler_version:
- '14'
docker_image:
- quay.io/condaforge/linux-anvil-aarch64:alma9
target_platform:
- linux-aarch64
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
