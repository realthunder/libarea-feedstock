context:
  version: "0.3.1"
  build: 0

package:
  name: libarea
  version: ${{ version }}

# Dan Heeks' libarea has no releases and no upstream tarball. The copy that is
# actually maintained was the one vendored in FreeCAD's Area module, and it now
# lives in a repository of its own -- the split this package existed to justify
# -- which is what this builds, from its tag rather than from a checkout beside
# this one, so the package names the revision it was built from.
source:
  git: https://github.com/realthunder/libarea.git
  rev: v${{ version }}

build:
  number: ${{ build }}
  script:
    - if: win
      then: bld.bat
      else: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('libarea', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - libarea/Area.h
        - libarea/Curve.h
        - libarea/kurve/geometry.h
        - libarea/clipper.hpp
        - libarea/clipper2/clipper.h
      lib:
        - area
      files:
        # Not one of package_contents' well-known keys, so the path is
        # taken literally -- and on Windows the install lands under
        # Library/.
        - if: win
          then: Library/lib/cmake/libarea/libareaConfig.cmake
          else: lib/cmake/libarea/libareaConfig.cmake
  # Builds and RUNS the library, so it only means anything where the
  # package's binaries can execute. On a cross build the compile would
  # succeed and ctest would die with exec-format (status 126), which
  # says nothing about the package -- so the whole test is native-only.
  # package_contents above still checks the cross-built artefact.
  - if: build_platform == target_platform
    then:
      script:
        - cmake -G Ninja -B build -S test_consumer -DCMAKE_BUILD_TYPE=Release
        - cmake --build build
        - ctest --test-dir build --output-on-failure
      requirements:
        run:
          - ${{ compiler('cxx') }}
          - ${{ stdlib('c') }}
          - cmake
          - ninja
      files:
        recipe:
          - test_consumer/

about:
  homepage: https://github.com/Heeks/libarea
  license: BSD-3-Clause AND BSL-1.0
  license_file:
    - libarea-License.txt
    - kurve/License.txt
    - clipper-License.txt
    - clipper2-License.txt
  summary: 2D area (closed curve) arithmetic with arcs, built on Clipper
  description: |
    libarea does boolean operations, offsetting and pocketing on closed 2D
    curves. Clipper does the actual clipping, on an integer lattice, so
    everything it touches comes back as straight segments; libarea's value is
    on either side of that. Going in, an arc is carried as a centre and an end
    point and only walked into segments at the last moment; coming out,
    FitArcs recognises runs of segments that lie on a circle and puts the arcs
    back. It also rebuilds the nesting of the result and re-winds contours by
    depth, so it tolerates input whose winding says nothing about what is a
    hole.

    Keeping arcs matters beyond fidelity. A profile that comes back faceted
    carries its face count into every operation downstream of it, which can
    cost more than the boolean the 2D path replaced.

    This is the copy that FreeCAD's Area module vendored, split out, minus the
    pieces that depend on FreeCAD. Clipper itself is built in and its headers
    installed alongside, so there is one library to link and one copy of
    Clipper in the process. Both versions are carried: the area arithmetic
    runs on Clipper2, and Clipper1 stays because FreeCAD's adaptive clearing
    still drives it directly.
